[package]
name = "deadoxide-launcher"
version = "0.1.0"
edition = "2021"
description = "DeadOxide launcher: find Project Zomboid, start the Rust client or the original, install mods from the registry"

[dependencies]
ureq = "3.5"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { package = "gpui-fast", version = "0.1.13" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.13" }

[lib]
name = "deadoxide_launcher"
path = "src/lib.rs"

[[bin]]
name = "deadoxide-launcher"
path = "src/main.rs"
