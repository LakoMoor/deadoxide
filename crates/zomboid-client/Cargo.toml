[package]
name = "zomboid-client"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "30"
winit = "0.30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
png = "0.17"

zomboid-content = { path = "../zomboid-content" }
zomboid-lua = { path = "../zomboid-lua" }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.27"
