name: launcher
# Builds the Windows launcher and attaches it to a GitHub release when a v* tag is pushed.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test launcher logic
        run: cargo test --release -p deadoxide-launcher
      - name: Build
        run: cargo build --release -p deadoxide-launcher -p zomboid-client
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/deadoxide-launcher.exe, target/release/zomboid-client.exe, LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath deadoxide-windows-x64.zip
          (Get-FileHash deadoxide-windows-x64.zip -Algorithm SHA256).Hash.ToLower() | Set-Content deadoxide-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: deadoxide-windows-x64
          path: deadoxide-windows-x64.zip*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: deadoxide-windows-x64.zip*
